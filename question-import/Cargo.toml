[package]
name = "question-import"
version = "0.1.0"
edition = "2024"
description = "Fetches trivia questions from a source and writes a question bank file for the game server"

[dependencies]
base64 = "0.22"
onevs100-gameserver = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP for the sources.
ureq = "3"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
