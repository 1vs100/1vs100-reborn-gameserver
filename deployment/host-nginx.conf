# The host's nginx in front of the stack. Copy it to /etc/nginx/conf.d/onevs100.conf (or
# sites-enabled) and replace 192.0.2.10 with GAMESERVER_BIND. It forwards everything to the
# stack's nginx on GAMESERVER_SITE_LISTEN (default 127.0.0.1:8083).
server {
    # The consoles dial this address. Requests to it skip any site with a plain `listen 80;`,
    # which then needs `listen 192.0.2.10:80;` as well (DEPLOYMENT.md).
    listen 192.0.2.10:80;
    # For HTTPS, add the site's domain here and run `certbot --nginx --no-redirect`.
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The Grid signs its replies over the Host header, and the console rejects a reply signed
        # for another host. `$host` drops the port and changes the case.
        proxy_set_header Host $http_host;
        # The stack's nginx limits each client by this address.
        proxy_set_header X-Real-IP $remote_addr;
        # The livehost stream lasts two minutes and is passed on as it arrives.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
